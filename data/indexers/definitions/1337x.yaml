download:
  selectors:
    - selector: 'a[href^="magnet:?xt=urn:btih:"]'
      attribute: href

search:
  paths:
    - path: "search/{{ .Keywords }}/1/"

  keywordsfilters:
    - name: re_replace
      args: ["\\bS(20\\d{2})\\b", "$1"]

  rows:
    selector: 'tr:has(a[href^="/torrent/"])'

  fields:
    title_default:
      selector: 'td[class^="coll-1"] a[href^="/torrent/"]'

    title_from_url:
      optional: true
      selector: 'td[class^="coll-1"] a[href^="/torrent/"]:contains("...")'
      attribute: href
      filters:
        - name: urldecode
        - name: split
          args: ["/", 3]

    title:
      text: "{{ if .Result.title_from_url }}{{ .Result.title_from_url }}{{ else }}{{ .Result.title_default }}{{ end }}"
      filters:
        - name: re_replace
          args: ["-([\\w]+(?:[\\[\\]\\(\\)\\w]+)?)$", "~$1"]
        - name: replace
          args: ["-", " "]
        - name: re_replace
          args: ["~([\\w]+(?:[\\[\\]\\(\\)\\w]+)?)$", "-$1"]
        - name: replace
          args: ["\u000f", ""]
        - name: re_replace
          args: ["(?i)\\sEP\\s(\\d{1,2})\\s(E?\\s?\\d{1,2})\\s", " E$1-$2 "]
        - name: re_replace
          args: ["(?i)\\sS(\\d{1,2})\\s?E\\s?(\\d{1,2})\\s(E?\\s?\\d{1,2})\\s", " S$1E$2-$3 "]
        - name: re_replace
          args: ["(?i)WEB\\sDL", "WEB-DL"]
        - name: re_replace
          args: ["(?i)HDTVRIP", "HDTV"]

    category_optional:
      optional: true
      selector: 'td[class^="coll-1"] a[href^="/sub/"]'
      attribute: href
      filters:
        - name: split
          args: ["/", 2]

    category:
      text: "{{ if .Result.category_optional }}{{ .Result.category_optional }}{{ else }}40{{ end }}"

    details:
      selector: 'td[class^="coll-1"] a[href^="/torrent/"]'
      attribute: href

    download:
      selector: 'td[class^="coll-1"] a[href^="/torrent/"]'
      attribute: href

    date_year:
      optional: true
      selector: "td[class^=\"coll-date\"]:not(:contains(\":\")):not(:contains(\"'\"))"
      filters:
        - name: re_replace
          args: ["st|nd|rd|th", ""]
        - name: dateparse
          args: "htt MMM. d"

    date_years:
      optional: true
      selector: "td[class^=\"coll-date\"]:contains(\"'\")"
      filters:
        - name: replace
          args: ["'", ""]
        - name: re_replace
          args: ["st|nd|rd|th", ""]
        - name: dateparse
          args: "MMM. d yy"

    date_today:
      optional: true
      selector: "td[class^=\"coll-date\"]:contains(\":\")"
      filters:
        - name: fuzzytime

    date:
      text: "{{ if or .Result.date_year .Result.date_years .Result.date_today }}{{ or .Result.date_year .Result.date_years .Result.date_today }}{{ else }}now{{ end }}"

    size:
      selector: 'td[class^="coll-4"]'

    seeders:
      selector: 'td[class^="coll-2"]'

    leechers:
      selector: 'td[class^="coll-3"]'

    uploader:
      selector: 'td[class^="coll-5"]'

    description:
      text: "Uploader: {{ .Result.uploader }}"

    downloadvolumefactor:
      text: "0"

    uploadvolumefactor:
      text: "1"